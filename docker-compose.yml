services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytdl-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DOWNLOAD_RETENTION_HOURS=${DOWNLOAD_RETENTION_HOURS:-24}
      - MIN_DISK_HEADROOM_MB=${MIN_DISK_HEADROOM_MB:-1024}
      - DOWNLOADS_BASE_PATH=/app/downloads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./downloads:/app/downloads
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ytdl-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytdl-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ytdl-net

networks:
  ytdl-net:
    driver: bridge
