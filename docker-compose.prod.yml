# ─────────────────────────────────────────────────────────────────────────────
# Production Docker Compose for YT Music Online Player
#
# Optimized for:
# - ~2 GB RAM Linux VM (AWS t4g.small, Oracle Cloud Free Tier, Hetzner, etc.)
# - Caddy reverse proxy with automatic HTTPS and HTTP challenge
# - Memory limits to prevent system OOM
# - Relative same-origin API URLs behind single domain
# ─────────────────────────────────────────────────────────────────────────────

services:
  caddy:
    image: caddy:2.9-alpine
    container_name: ytdl-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_HASH: ${AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ytdl-prod-net
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytdl-backend-prod
    restart: unless-stopped
    environment:
      CORS_ORIGINS: "https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}"
      LOG_LEVEL: INFO
      MAX_CONCURRENT_DOWNLOADS: "2"
      MAX_CONCURRENT_STREAMS: "3"
      MIN_DISK_HEADROOM_MB: "1024"
      DOWNLOAD_RETENTION_HOURS: "0"
      TEMP_CLEANUP_HOURS: "24"
      DOWNLOADS_BASE_PATH: /app/downloads
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    volumes:
      - ./downloads:/app/downloads
      - ${YTDLP_COOKIES_PATH:-./cookies}:/app/cookies:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ytdl-prod-net
    deploy:
      resources:
        limits:
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty values configure same-origin relative URLs (/api/... and wss://host)
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    container_name: ytdl-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ytdl-prod-net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  ytdl-prod-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
